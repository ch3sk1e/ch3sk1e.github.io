baseURL = 'https://ch3sksec.com/'
locale = 'en-us'
title = "ch3sksec"
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[minify]
  disableXML = true

[params]
  env = 'production'
  title = 'ch3sksec'
  description = 'Notes and write-ups from red team engagements, certification prep, and offensive security research.'
  keywords = ['red team', 'offensive security', 'Active Directory', 'Azure', 'Entra ID', 'CARTP', 'CRTO']
  author = 'ch3sk1e'
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = true
    title = "ch3sk-sec"
    subtitle = "Red team notes, certification reviews, and offensive security write-ups."
    imageUrl = "logoBlack.png"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "ch3sksec logo"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/posts/"

    [[params.profileMode.buttons]]
      name = "About"
      url = "/about/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ch3sk1e"
  
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/francesco-piscitelli-12253367/"

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 20

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
